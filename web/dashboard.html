<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>Hakuna Opportunities Monitor</title>
<style>
  /* Light theme (default) */
  :root {
    --bg: #ffffff;
    --bg-card: #f6f8fa;
    --bg-draft: #f0f2f5;
    --bg-input: #ffffff;
    --bg-bar-track: #e8eaed;
    --bg-tag: #f0f4f8;
    --border: #d0d7de;
    --border-card: #d0d7de;
    --text: #1f2328;
    --text-heading: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8b949e;
    --text-draft: #1f2328;
    --link: #0969da;
    --accent: #0969da;
    --btn-bg: #e8eaed;
    --btn-text: #1f2328;
    --btn-hover: #d0d7de;
    --badge-seen-bg: #e8eaed;
    --badge-seen-text: #656d76;
    --date-scheme: light;
  }

  /* Dark theme */
  [data-theme="dark"] {
    --bg: #0f1419;
    --bg-card: #1a1f26;
    --bg-draft: #161b22;
    --bg-input: #1a1f26;
    --bg-bar-track: #161b22;
    --bg-tag: #1c2533;
    --border: #30363d;
    --border-card: #2f3640;
    --text: #e7e9ea;
    --text-heading: #fff;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --text-draft: #c9d1d9;
    --link: #58a6ff;
    --accent: #58a6ff;
    --btn-bg: #30363d;
    --btn-text: #c9d1d9;
    --btn-hover: #3d444d;
    --badge-seen-bg: #30363d;
    --badge-seen-text: #8b949e;
    --date-scheme: dark;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; max-width: 1200px; margin: 0 auto; line-height: 1.5; }
  h1 { margin-bottom: 0.25rem; color: var(--text-heading); font-size: 1.5rem; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem; }

  /* Title bar */
  .title-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
  .theme-toggle { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.15s; }
  .theme-toggle:hover { background: var(--btn-hover); }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 20px; cursor: pointer; color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Filters */
  .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; align-items: end; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; }
  .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .filter-group label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .filter-group select,
  .filter-group input { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; transition: border-color 0.15s; max-width: 220px; }
  .filter-group select:focus,
  .filter-group input:focus { outline: none; border-color: var(--accent); }
  .filter-group input[type="date"] { color-scheme: var(--date-scheme); }
  .btn-reset, .btn-mark-all { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; align-self: end; transition: background 0.15s; }
  .btn-reset:hover, .btn-mark-all:hover { background: var(--btn-hover); }
  .btn-read { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 3px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; margin-left: auto; transition: background 0.15s; }
  .btn-read:hover { background: var(--btn-hover); }

  .stats { color: var(--text-secondary); margin-bottom: 0.75rem; font-size: 0.85rem; }

  /* Pagination */
  .pager { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 1.25rem 0 0.5rem; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; font-size: 0.85rem; color: var(--text-secondary); }
  .pager button { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: background 0.15s; }
  .pager button:hover:not(:disabled) { background: var(--btn-hover); }
  .pager button:disabled { opacity: 0.45; cursor: not-allowed; }
  .pager .pager-info { margin: 0 0.25rem; }
  .pager input[type="number"] { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 0.8rem; width: 4.5rem; }
  .pager input[type="number"]:focus { outline: none; border-color: var(--accent); }
  .pager-spacer { flex: 1; }
  .pager.hidden { display: none; }

  /* Cards */
  .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; transition: box-shadow 0.15s; }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  [data-theme="dark"] .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .score { font-weight: 700; font-size: 1rem; padding: 3px 9px; border-radius: 6px; }
  .score-high { background: #1a7f37; color: #fff; }
  .score-mid { background: #9e6a03; color: #fff; }
  .score-low { background: #6e7681; color: #fff; }
  .subreddit { color: var(--text-secondary); font-size: 0.85rem; }
  h2 { font-size: 1.05rem; margin-bottom: 0.4rem; line-height: 1.4; }
  h2 a { color: var(--link); text-decoration: none; }
  h2 a:hover { text-decoration: underline; }
  .meta { color: var(--text-secondary); font-size: 0.85rem; display: flex; gap: 1.25rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .details p { margin-bottom: 0.35rem; font-size: 0.9rem; line-height: 1.5; }
  .details strong { color: var(--text-secondary); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.3px; }
  .draft { margin-top: 0.75rem; background: var(--bg-draft); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .draft-header { padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; user-select: none; font-size: 0.9rem; font-weight: 600; }
  .draft-header:hover { background: var(--btn-hover); }
  .draft-toggle { font-size: 0.7rem; color: var(--text-secondary); transition: transform 0.2s; }
  .draft-toggle.open { transform: rotate(90deg); }
  .draft-body { padding: 0 1rem 1rem; display: none; }
  .draft-body.open { display: block; }
  .draft button { background: #238636; color: #fff; border: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .draft button:hover { background: #2ea043; }
  .draft pre { white-space: pre-wrap; font-family: inherit; font-size: 0.9rem; line-height: 1.6; color: var(--text-draft); margin-top: 0.5rem; }
  .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-new { background: #da3633; color: #fff; }
  .badge-seen { background: var(--badge-seen-bg); color: var(--badge-seen-text); }
  .card-new { border-left: 3px solid #da3633; }
  .card-seen { opacity: 0.65; }
  .empty { text-align: center; padding: 3rem; color: var(--text-secondary); }
  .date-stamp { font-size: 0.8rem; color: var(--text-muted); }

  /* Tags for tools/categories on opportunity cards */
  .tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
  .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--bg-tag); border: 1px solid var(--border); color: var(--text-secondary); }
  .tag-tool { border-color: #1f6feb; color: #1f6feb; }
  .tag-pain { border-color: #9e6a03; color: #9e6a03; }
  .tag-func { border-color: #1a7f37; color: #1a7f37; }
  .company-hint { margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); font-style: italic; }

  /* Intel section */
  .intel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
  .intel-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 1.5rem; }
  .intel-card h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--text); }
  .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; padding: 2px 4px; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
  .bar-row:hover { background: var(--btn-hover); }
  .bar-label { min-width: 140px; font-size: 0.85rem; color: var(--text); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .company-list li[data-drill-dim] { cursor: pointer; transition: background 0.15s; padding-left: 4px; padding-right: 4px; border-radius: 4px; }
  .company-list li[data-drill-dim]:hover { background: var(--btn-hover); }

  .bar-track { flex: 1; height: 20px; background: var(--bg-bar-track); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; min-width: 2px; transition: width 0.3s; }
  .bar-fill-blue { background: #1f6feb; }
  .bar-fill-orange { background: #d29922; }
  .bar-fill-green { background: #238636; }
  .bar-fill-purple { background: #8957e5; }
  .bar-fill-red { background: #da3633; }
  .bar-fill-teal { background: #1b7c83; }
  .bar-count { min-width: 30px; font-size: 0.85rem; color: var(--text-secondary); }
  .intel-stat { text-align: center; padding: 1rem; }
  .intel-stat .big-number { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
  .intel-stat .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem; }
  .company-list { list-style: none; }
  .company-list li { padding: 0.5rem 0; border-bottom: 1px solid var(--border-card); font-size: 0.9rem; }
  .company-list li:last-child { border-bottom: none; }
  .company-list li.co-hidden { display: none; }
  .company-list.expanded li.co-hidden { display: list-item; }
  .company-list .co-name { color: var(--link); font-weight: 600; }
  .company-list .co-count { color: var(--text-secondary); font-size: 0.75rem; font-weight: 500; }
  .company-list .co-meta { color: var(--text-secondary); font-size: 0.8rem; }
  .co-expand { margin-top: 0.5rem; background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border); padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .co-expand:hover { background: var(--btn-hover); }

  /* Pivot mode controls (Market Intelligence tab) */
  .intel-controls { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; padding: 0.75rem 1rem; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; }
  .pivot-toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: var(--text); cursor: pointer; user-select: none; font-weight: 600; }
  .pivot-toggle input { cursor: pointer; }
  .pivot-hint { font-size: 0.8rem; color: var(--text-secondary); font-style: italic; }
  .pivot-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  .pivot-chip { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; padding: 3px 4px 3px 9px; background: var(--bg-tag); border: 1px solid var(--accent); color: var(--text); border-radius: 12px; }
  .pivot-chip strong { color: var(--accent); }
  .pivot-chip-x { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; padding: 0 4px; line-height: 1; border-radius: 50%; }
  .pivot-chip-x:hover { background: var(--btn-hover); color: var(--text); }
  .pivot-drill-btn { margin-left: auto; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; background: var(--accent); color: var(--btn-primary-text, #fff); border: 1px solid var(--accent); border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .pivot-drill-btn:hover { filter: brightness(1.1); }
  .intel-card.intel-card-pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* Gartner rating badges on tool tags and bar chart */
  .gartner-badge { font-size: 0.65rem; color: #d29922; font-weight: 600; margin-left: 2px; }
  .bar-gartner { font-size: 0.75rem; color: #d29922; font-weight: 600; margin-left: 4px; white-space: nowrap; }

  /* Skeleton loading placeholders — animated until real content replaces them. */
  @keyframes skeleton-shimmer {
    0%   { background-position: -240px 0; }
    100% { background-position: calc(240px + 100%) 0; }
  }
  .skel { background: var(--bg-bar-track); background-image: linear-gradient(90deg, transparent 0%, var(--btn-hover) 50%, transparent 100%); background-size: 240px 100%; background-repeat: no-repeat; border-radius: 4px; animation: skeleton-shimmer 1.4s ease-in-out infinite; }
  .skel-line { height: 0.85rem; margin: 0.45rem 0; }
  .skel-line.w-30 { width: 30%; }
  .skel-line.w-50 { width: 50%; }
  .skel-line.w-70 { width: 70%; }
  .skel-line.w-90 { width: 90%; }
  .skel-line.tall { height: 1.4rem; }
  .skel-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .skel-bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
  .skel-bar-row .skel-bar-label { width: 130px; height: 0.85rem; flex-shrink: 0; }
  .skel-bar-row .skel-bar-track { flex: 1; height: 20px; }
  .skel-bar-row .skel-bar-count { width: 24px; height: 0.85rem; }
  @media (prefers-reduced-motion: reduce) {
    .skel { animation: none; }
  }

  /* ── Tablet (≤768px) ───────────────────────────────────────────── */
  @media (max-width: 768px) {
    body { padding: 1rem; }
    h1 { font-size: 1.25rem; }
    .filters { padding: 0.75rem; gap: 0.5rem; }
    .filter-group { flex: 1 1 calc(50% - 0.5rem); min-width: 120px; }
    .filter-group select,
    .filter-group input { max-width: 100%; width: 100%; }
    .card { padding: 1rem 1.15rem; }
    .intel-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .intel-card { padding: 1.15rem; }
    .bar-label { min-width: 110px; font-size: 0.8rem; }
    .pager { gap: 0.4rem; padding: 0.6rem 0.75rem; }
  }

  /* ── Mobile (≤480px) ───────────────────────────────────────────── */
  @media (max-width: 480px) {
    body { padding: 0.75rem; }
    h1 { font-size: 1.1rem; }
    .subtitle { font-size: 0.8rem; margin-bottom: 1rem; }
    .title-bar { flex-wrap: wrap; gap: 0.5rem; }
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab { padding: 8px 14px; font-size: 0.85rem; white-space: nowrap; }
    .filters { padding: 0.6rem; gap: 0.5rem; }
    .filter-group { flex: 1 1 100%; min-width: 0; }
    .filter-group select,
    .filter-group input { max-width: 100%; width: 100%; }
    .btn-reset, .btn-mark-all { flex: 1 1 calc(50% - 0.25rem); text-align: center; }
    .card { padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 0.75rem; }
    .header { gap: 0.4rem; }
    h2 { font-size: 0.95rem; }
    .meta { gap: 0.75rem; font-size: 0.8rem; }
    .details p { font-size: 0.85rem; }
    .draft-header { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
    .draft pre { font-size: 0.82rem; }
    .intel-grid { grid-template-columns: 1fr; gap: 0.85rem; }
    .intel-card { padding: 1rem; }
    .bar-label { min-width: 80px; font-size: 0.75rem; }
    .bar-track { height: 16px; }
    .bar-count { font-size: 0.75rem; min-width: 24px; }
    .bar-row { gap: 0.5rem; }
    .intel-stat .big-number { font-size: 2rem; }
    .intel-controls { flex-direction: column; align-items: stretch; gap: 0.5rem; padding: 0.6rem 0.75rem; }
    .pager { flex-wrap: wrap; gap: 0.35rem; padding: 0.5rem 0.6rem; font-size: 0.8rem; justify-content: center; }
    .pager button { padding: 5px 8px; font-size: 0.75rem; }
    .pager-spacer { display: none; }
    .pager input[type="number"] { width: 3.5rem; }
    .stats { font-size: 0.8rem; }
  }
</style>
</head>
<body>
<div class="title-bar">
  <h1>Hakuna Opportunities Monitor</h1>
  <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">Dark mode</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('intel')">Market Intelligence</div>
  <div class="tab" onclick="switchTab('opportunities')">Opportunities</div>
</div>

<!-- Opportunities Tab -->
<div id="tab-opportunities" class="tab-content">

<div class="filters">
  <div class="filter-group">
    <label>Source / Category</label>
    <select id="f-sub"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Min Score</label>
    <select id="f-score">
      <option value="">Any</option>
      <option value="10">10</option>
      <option value="9">9+</option>
      <option value="8">8+</option>
      <option value="7">7+</option>
      <option value="6">6+</option>
      <option value="5">5+</option>
      <option value="4">4+</option>
      <option value="3">3+</option>
      <option value="2">2+</option>
      <option value="1">1+</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Status</label>
    <select id="f-status">
      <option value="">All</option>
      <option value="new">New only</option>
      <option value="seen">Seen only</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Tool</label>
    <select id="f-tool"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Pain Category</label>
    <select id="f-pain"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Team Function</label>
    <select id="f-function"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Industry</label>
    <select id="f-industry"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Company Size</label>
    <select id="f-employee_range"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Team Size</label>
    <select id="f-team_size"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Maturity</label>
    <select id="f-maturity"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Country</label>
    <select id="f-country"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Company</label>
    <select id="f-company"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>From</label>
    <input type="date" id="f-from">
  </div>
  <div class="filter-group">
    <label>To</label>
    <input type="date" id="f-to">
  </div>
  <div class="filter-group">
    <label>Sort by</label>
    <select id="f-sort">
      <option value="date-desc">Date (newest)</option>
      <option value="date-asc">Date (oldest)</option>
      <option value="score-desc">Score (highest)</option>
      <option value="score-asc">Score (lowest)</option>
      <option value="upvotes-desc">Upvotes (most)</option>
      <option value="upvotes-asc">Upvotes (least)</option>
      <option value="subreddit">Subreddit</option>
    </select>
  </div>
  <button class="btn-reset" onclick="resetFilters()">Reset</button>
  <button class="btn-mark-all" onclick="markAllRead()">Mark all as read</button>
</div>

<p class="stats" id="stats"></p>
<div id="cards">
  <div class="skel-card" aria-hidden="true">
    <div class="skel skel-line tall w-50"></div>
    <div class="skel skel-line w-30"></div>
    <div class="skel skel-line w-90"></div>
    <div class="skel skel-line w-70"></div>
  </div>
  <div class="skel-card" aria-hidden="true">
    <div class="skel skel-line tall w-70"></div>
    <div class="skel skel-line w-50"></div>
    <div class="skel skel-line w-90"></div>
    <div class="skel skel-line w-30"></div>
  </div>
  <div class="skel-card" aria-hidden="true">
    <div class="skel skel-line tall w-50"></div>
    <div class="skel skel-line w-30"></div>
    <div class="skel skel-line w-90"></div>
    <div class="skel skel-line w-70"></div>
  </div>
</div>
<nav class="pager hidden" id="pager" aria-label="Pagination">
  <button type="button" id="page-first" title="First page">&laquo; First</button>

<script>
const READ_KEY = 'hakuna_read_threads';
const PAGE_SIZE = 50;

// INTEL is the unfiltered baseline fetched on load (drives the filter dropdowns
// and the default Market Intelligence view). intelView is what the Intel grid
// currently renders — equals INTEL until a pivot is active, at which point it
// holds the result of /api/intel?<pivots>. Opportunities are paginated
// server-side via /api/opportunities and are unaffected by pivot state.
let INTEL = null;
let intelView = null;
let pivotMode = false;
const intelPivots = {};
let currentPage = 1;
let lastPageMeta = { total: 0, total_pages: 1, page: 1 };

// Each dimension knows its filter dropdown id, the INTEL key to populate it from
// (or null for the company case which is built ad-hoc). Server-side filtering
// uses the param name = filter id with the "f-" prefix stripped.
const DRILL_DIMENSIONS = {
  tool:           { filterId: 'f-tool',           intelKey: 'tools' },
  pain:           { filterId: 'f-pain',           intelKey: 'pain_point_categories' },
  function:       { filterId: 'f-function',       intelKey: 'team_functions' },
  employee_range: { filterId: 'f-employee_range', intelKey: 'employee_ranges' },
  maturity:       { filterId: 'f-maturity',       intelKey: 'maturity_levels' },
  industry:       { filterId: 'f-industry',       intelKey: 'industries' },
  team_size:      { filterId: 'f-team_size',      intelKey: 'security_team_sizes' },
  country:        { filterId: 'f-country',        intelKey: 'countries' },
  company:        { filterId: 'f-company',        intelKey: null },
};

// Drill click → set the matching dropdown's value, switch to opportunities, re-render.
function drillTo(dimension, value) {
  const dim = DRILL_DIMENSIONS[dimension];
  if (!dim) return;
  const sel = document.getElementById(dim.filterId);
  if (sel) sel.value = value;
  currentPage = 1;
  switchTab('opportunities');
  render();
}

// Pivot click → pin a (dimension, value) pair and re-aggregate the intel grid
// over only matching threads. Multiple pivots compose (AND).
async function pivotOn(dimension, value) {
  if (!DRILL_DIMENSIONS[dimension]) return;
  intelPivots[dimension] = value;
  await applyPivots();
}

async function clearPivot(dimension) {
  delete intelPivots[dimension];
  await applyPivots();
}

function clearAllPivots() {
  Object.keys(intelPivots).forEach(k => delete intelPivots[k]);
}

// Drill from the active pivots into the Opportunities tab: clear any existing
// dimension filters, push each pivot into its matching dropdown, then render.
function drillToOpportunitiesFromPivots() {
  const entries = Object.entries(intelPivots);
  if (entries.length === 0) return;
  // Reset the dimension filters first so leftover values don't AND with pivots.
  Object.values(DRILL_DIMENSIONS).forEach(dim => {
    const sel = document.getElementById(dim.filterId);
    if (sel) sel.value = '';
  });
  entries.forEach(([dimension, value]) => {
    const dim = DRILL_DIMENSIONS[dimension];
    if (!dim) return;
    const sel = document.getElementById(dim.filterId);
    if (sel) sel.value = value;
  });
  currentPage = 1;
  switchTab('opportunities');
  render();
}

// Refresh intelView from /api/intel using the active pivots, then re-render.
// With no active pivots we skip the request and fall back to baseline INTEL.
async function applyPivots() {
  const keys = Object.keys(intelPivots);
  if (keys.length === 0) {
    intelView = INTEL;
    renderIntel();
    return;
  }
  const params = new URLSearchParams();
  keys.forEach(k => params.set(k, intelPivots[k]));
  try {
    const res = await fetch('/api/intel?' + params.toString());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    intelView = await res.json();
  } catch (e) {
    console.error('pivot fetch failed', e);
    intelView = INTEL;
  }
  renderIntel();
}

function renderPivotChips() {
  const chips = document.getElementById('pivot-chips');
  if (!chips) return;
  const entries = Object.entries(intelPivots);
  if (entries.length === 0) {
    chips.innerHTML = pivotMode
      ? '<span class="pivot-hint">Click any bar below to pivot. Pinned dimensions compose (AND).</span>'
      : '';
    return;
  }
  const chipHtml = entries.map(([dim, val]) =>
    `<span class="pivot-chip">${esc(dim)}: <strong>${esc(val)}</strong>` +
    `<button class="pivot-chip-x" data-pivot-clear="${esc(dim)}" title="Remove pivot" aria-label="Remove pivot">&times;</button></span>`
  ).join('');
  const drillBtn = `<button class="pivot-drill-btn" data-pivot-drill="1" title="Open the Opportunities tab filtered by these pivots">View opportunities &rarr;</button>`;
  chips.innerHTML = chipHtml + drillBtn;
}

function setPivotMode(enabled) {
  pivotMode = enabled;
  const toggle = document.getElementById('pivot-mode-toggle');
  if (toggle) toggle.checked = enabled;
  if (!enabled && Object.keys(intelPivots).length > 0) {
    clearAllPivots();
    intelView = INTEL;
    renderIntel();
  } else {
    renderPivotChips();
  }
}

function populateDimensionFilters() {
  if (!INTEL) return;
  for (const [key, dim] of Object.entries(DRILL_DIMENSIONS)) {
    const sel = document.getElementById(dim.filterId);
    if (!sel) continue;
    const current = sel.value;
    let items;
    if (key === 'company') {
      // named_companies has one entry per thread — dedupe + count.
      const counts = new Map();
      (INTEL.named_companies || []).forEach(c => {
        if (c && c.name) counts.set(c.name, (counts.get(c.name) || 0) + 1);
      });
      items = [...counts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .map(([name, count]) => ({ name, count }));
    } else {
      items = (INTEL[dim.intelKey] || []);
    }
    sel.innerHTML = '<option value="">All</option>';
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.name;
      opt.textContent = item.count != null ? `${item.name} (${item.count})` : item.name;
      sel.appendChild(opt);
    });
    if (current) sel.value = current;
  }
}

// Filter dropdowns whose values are persisted to the URL. The URL param name is
// the id with the "f-" prefix stripped (e.g. f-sub → ?sub=...). The same names
// are forwarded to /api/opportunities (with f-score → min_score remapped below).
const FILTER_IDS = ['f-sub', 'f-score', 'f-status', 'f-tool', 'f-pain', 'f-function', 'f-industry', 'f-employee_range', 'f-team_size', 'f-maturity', 'f-country', 'f-company', 'f-from', 'f-to', 'f-sort'];

function applyURLState() {
  const params = new URLSearchParams(location.search);
  FILTER_IDS.forEach(id => {
    const key = id.slice(2);
    if (!params.has(key)) return;
    const el = document.getElementById(id);
    if (el) el.value = params.get(key);
  });
  const pageParam = parseInt(params.get('page'), 10);
  if (pageParam && pageParam > 0) currentPage = pageParam;
}

function updateURL() {
  const params = new URLSearchParams();
  if (document.getElementById('tab-opportunities').classList.contains('active')) {
    params.set('tab', 'opportunities');
  }
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (!el || !el.value) return;
    if (id === 'f-sort' && el.value === 'date-desc') return; // skip default
    params.set(id.slice(2), el.value);
  });
  if (currentPage > 1) params.set('page', String(currentPage));
  const qs = params.toString();
  history.replaceState(null, '', qs ? location.pathname + '?' + qs : location.pathname);
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  document.querySelector(`.tab[onclick*="${tabName}"]`).classList.add('active');
  if (tabName === 'intel') renderIntel();
  updateURL();
}

function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); }
  catch { return new Set(); }
}

function saveReadSet(s) {
  localStorage.setItem(READ_KEY, JSON.stringify([...s]));
}

function markRead(threadId) {
  const readSet = getReadSet();
  readSet.add(threadId);
  saveReadSet(readSet);
  render();
}

async function markAllRead() {
  // Fetch every id matching the current server-side filters (across all pages)
  // so the button has the same scope it had pre-pagination.
  const url = '/api/opportunities/ids?' + buildFilterQuery();
  let ids = [];
  try {
    const res = await fetch(url);
    if (res.ok) {
      const body = await res.json();
      ids = body.ids || [];
    }
  } catch (e) {
    console.error('mark-all fetch failed', e);
  }
  const readSet = getReadSet();
  ids.forEach(id => readSet.add(id));
  saveReadSet(readSet);
  render();
}

async function loadData() {
  // Pull INTEL (small) + sources dropdown in parallel before first render.
  try {
    const [intelRes] = await Promise.all([
      fetch('intel.json').then(r => r.ok ? r.json() : null),
      populateSubreddits(),
      loadGartner(),
    ]);
    INTEL = intelRes;
    intelView = INTEL;
  } catch (e) {
    console.error('initial load failed', e);
  }
  populateDimensionFilters();
  applyURLState();
  if (new URLSearchParams(location.search).get('tab') === 'opportunities') switchTab('opportunities');
  renderIntel();
  render();
}

function sourceCategoryKey(t) {
  // Composite "source/category" for use as filter value and stable id
  const source = t.source || 'reddit';
  return source + '/' + (t.category || '');
}

function sourceCategoryLabel(t) {
  // Human label: Reddit shows r/sysadmin, others show source/category
  const source = t.source || 'reddit';
  const cat = t.category || '';
  return source === 'reddit' ? 'r/' + cat : source + '/' + cat;
}

async function populateSubreddits() {
  const sel = document.getElementById('f-sub');
  sel.innerHTML = '<option value="">All</option>';
  try {
    const res = await fetch('/api/sources');
    if (!res.ok) return;
    const body = await res.json();
    (body.sources || []).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.key;
      opt.textContent = s.count != null ? `${s.label} (${s.count})` : s.label;
      sel.appendChild(opt);
    });
  } catch (e) {
    console.error('failed to load sources', e);
  }
}

// Build the query string forwarded to /api/opportunities and /api/opportunities/ids.
// Status (new/seen) is excluded — it depends on per-user localStorage and is
// applied client-side as a post-filter on the returned page.
function buildFilterQuery() {
  const params = new URLSearchParams();
  FILTER_IDS.forEach(id => {
    if (id === 'f-status') return;
    const el = document.getElementById(id);
    if (!el || !el.value) return;
    const key = id.slice(2);
    // Server expects min_score, not score.
    params.set(key === 'score' ? 'min_score' : key, el.value);
  });
  return params.toString();
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function scoreClass(s) {
  return parseInt(s) >= 8 ? 'high' : 'mid';
}

function renderTags(items, cls, enrichGartner) {
  if (!items || items.length === 0) return '';
  return '<div class="tag-list">' + items.map(i => {
    const badge = enrichGartner ? gartnerBadge(i) : '';
    return `<span class="tag ${cls}">${esc(i)}${badge}</span>`;
  }).join('') + '</div>';
}

function renderCompanyHint(profile) {
  if (!profile) return '';
  const parts = [];
  if (profile.company_name) parts.push(profile.company_name);
  if (profile.industry) parts.push(profile.industry);
  if (profile.employee_range) parts.push(profile.employee_range + ' employees');
  if (profile.security_team_size) parts.push('security team: ' + profile.security_team_size);
  if (profile.maturity_level && profile.maturity_level !== 'null') parts.push('maturity: ' + profile.maturity_level);
  if (profile.country) parts.push('country: ' + profile.country);
  if (parts.length === 0) return '';
  return `<p class="company-hint">Company signals: ${esc(parts.join(' / '))}</p>`;
}

// Re-entrancy guard so a slow request doesn't overwrite a newer one.
let renderToken = 0;

function skeletonCardsHTML(n) {
  let html = '';
  for (let i = 0; i < n; i++) {
    html += '<div class="skel-card" aria-hidden="true">' +
      '<div class="skel skel-line tall w-50"></div>' +
      '<div class="skel skel-line w-30"></div>' +
      '<div class="skel skel-line w-90"></div>' +
      '<div class="skel skel-line w-70"></div>' +
      '</div>';
  }
  return html;
}

async function render() {
  updateURL();
  const myToken = ++renderToken;

  const cardsEl = document.getElementById('cards');
  const statsEl = document.getElementById('stats');
  const pagerEl = document.getElementById('pager');

  statsEl.textContent = 'Loading…';
  cardsEl.innerHTML = skeletonCardsHTML(3);
  pagerEl.classList.add('hidden');

  const params = buildFilterQuery();
  const url = `/api/opportunities?${params}${params ? '&' : ''}page=${currentPage}&page_size=${PAGE_SIZE}`;

  let body;
  // Retry on 5xx: Cloud Run can return 503 during cold-start or when both
  // instances are busy. Three tries with exponential backoff turns a transient
  // 503 into a small delay instead of a hard error the user has to refresh past.
  const MAX_ATTEMPTS = 3;
  let lastErr;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        body = await res.json();
        lastErr = null;
        break;
      }
      lastErr = new Error(`HTTP ${res.status}`);
      if (res.status < 500 || attempt === MAX_ATTEMPTS) break;
    } catch (e) {
      lastErr = e;
      if (attempt === MAX_ATTEMPTS) break;
    }
    if (myToken !== renderToken) return;
    await new Promise(r => setTimeout(r, 400 * 2 ** (attempt - 1)));
  }
  if (lastErr) {
    if (myToken !== renderToken) return;
    console.error('failed to load opportunities', lastErr);
    statsEl.textContent = '';
    cardsEl.innerHTML = `<p class="empty">Failed to load opportunities: ${esc(String(lastErr))}. Try refreshing.</p>`;
    pagerEl.classList.add('hidden');
    return;
  }
  if (myToken !== renderToken) return;

  // Server may have clamped the page (e.g. filters reduced total_pages).
  if (body.page && body.page !== currentPage) {
    currentPage = body.page;
    updateURL();
  }
  lastPageMeta = { total: body.total || 0, total_pages: body.total_pages || 1, page: body.page || 1 };

  // Apply localStorage read-state overlay + the (client-side) status filter.
  const readSet = getReadSet();
  let items = (body.items || []).map(d => {
    const id = (d.thread || {}).id;
    if (id && readSet.has(id)) d.is_new = false;
    return d;
  });
  const status = document.getElementById('f-status').value;
  if (status === 'new') items = items.filter(d => d.is_new);
  else if (status === 'seen') items = items.filter(d => !d.is_new);

  const newCount = items.filter(d => d.is_new).length;
  const seenCount = items.length - newCount;
  const totalAcrossPages = body.total || 0;
  const statusNote = status ? ` (status filter applied to this page)` : '';
  statsEl.textContent =
    `Showing ${items.length} on this page — page ${lastPageMeta.page} of ${lastPageMeta.total_pages}, ${totalAcrossPages} total across all pages, ${newCount} new / ${seenCount} seen${statusNote}`;

  renderPager();

  if (items.length === 0) {
    cardsEl.innerHTML = '<p class="empty">No opportunities match the current filters.</p>';
    return;
  }

  const html = items.map(d => {
    const t = d.thread;
    const s = d.scorer_result;
    const score = s.score || '?';
    const painPoints = (s.pain_points_identified || []).join(', ');
    const riskFlags = (s.risk_flags || []).join(', ') || 'None';
    const angle = esc(s.reply_angle || '');
    const isNew = d.is_new;
    const badge = isNew
      ? '<span class="badge badge-new">NEW</span>'
      : '<span class="badge badge-seen">SEEN</span>';
    const addedDate = d.added_at ? new Date(d.added_at).toLocaleDateString() : '';

    const readBtn = isNew
      ? `<button class="btn-read" onclick="markRead('${t.id}')">Mark as read</button>`
      : '';

    const toolTags = renderTags(s.tools_detected, 'tag-tool', true);
    const painTags = renderTags(s.pain_point_categories, 'tag-pain');
    const funcTags = renderTags(s.team_functions, 'tag-func');
    const companyHint = renderCompanyHint(s.company_profile);

    const sourceLabel = sourceCategoryLabel(t);
    const engagementLabel = (t.source || 'reddit') === 'reddit' ? 'Upvotes' : 'Replies';
    const draftHtml = d.draft
      ? `<div class="draft">
          <div class="draft-header" onclick="toggleDraft(this)">
            <span class="draft-toggle">&#9654;</span>
            Draft Reply
            <button onclick="event.stopPropagation(); copyDraft(this)">Copy</button>
          </div>
          <div class="draft-body">
            <pre>${esc(d.draft)}</pre>
          </div>
        </div>`
      : '';

    return `
      <div class="card ${isNew ? 'card-new' : 'card-seen'}">
        <div class="header">
          ${badge}
          <span class="score score-${scoreClass(score)}">${score}/10</span>
          <span class="subreddit">${esc(sourceLabel)}</span>
          <span class="date-stamp">${addedDate}</span>
          ${readBtn}
        </div>
        <h2><a href="${esc(t.url)}" target="_blank">${esc(t.title)}</a></h2>
        <div class="meta">
          <span>${engagementLabel}: ${t.score}</span>
          <span>Posted: ${esc(d.time_ago)}</span>
        </div>
        <div class="details">
          <p><strong>Pain points:</strong> ${esc(painPoints)}</p>
          <p><strong>Angle:</strong> ${angle}</p>
          <p><strong>Watch out:</strong> ${esc(riskFlags)}</p>
          ${toolTags ? '<p style="margin-top:0.5rem"><strong>Tools:</strong></p>' + toolTags : ''}
          ${painTags ? '<p style="margin-top:0.5rem"><strong>Categories:</strong></p>' + painTags : ''}
          ${funcTags ? '<p style="margin-top:0.5rem"><strong>Team functions:</strong></p>' + funcTags : ''}
          ${companyHint}
        </div>
        ${draftHtml}
      </div>`;
  }).join('');

  document.getElementById('cards').innerHTML = html;
}

function renderPager() {
  const pagerEl = document.getElementById('pager');
  const { total_pages, page } = lastPageMeta;
  if (!total_pages || total_pages <= 1) {
    pagerEl.classList.add('hidden');
    return;
  }
  pagerEl.classList.remove('hidden');
  document.getElementById('pager-info').textContent = `Page ${page} of ${total_pages}`;
  document.getElementById('page-first').disabled = page <= 1;
  document.getElementById('page-prev').disabled = page <= 1;
  document.getElementById('page-next').disabled = page >= total_pages;
  document.getElementById('page-last').disabled = page >= total_pages;
  const jump = document.getElementById('page-jump');
  jump.max = String(total_pages);
  jump.value = String(page);
}

function goToPage(p) {
  const target = Math.max(1, Math.min(p, lastPageMeta.total_pages || 1));
  if (target === currentPage) return;
  currentPage = target;
  render();
}

function renderBarChart(items, fillClass, maxBars, dimension) {
  if (!items || items.length === 0) return '<p class="empty" style="padding:1rem">No data yet</p>';
  const top = items.slice(0, maxBars || 10);
  const maxCount = top[0].count;
  return top.map(item => {
    const pct = maxCount > 0 ? (item.count / maxCount * 100) : 0;
    const drillAttrs = dimension
      ? ` data-drill-dim="${esc(dimension)}" data-drill-value="${esc(item.name)}" title="${esc(item.name)} — click to view threads"`
      : '';
    const gBadge = dimension === 'tool' ? gartnerBadge(item.name) : '';
    return `<div class="bar-row"${drillAttrs}>
      <span class="bar-label">${esc(item.name)}${gBadge}</span>
      <div class="bar-track"><div class="bar-fill ${fillClass}" style="width:${pct}%"></div></div>
      <span class="bar-count">${item.count}</span>
    </div>`;
  }).join('');
}

// ── Gartner enrichment (loaded once, used across views) ──────────

let gartnerVendors = null;  // name→{rating, review_count, ...} lookup
let gartnerLoaded = false;

async function loadGartner() {
  if (gartnerLoaded) return;
  try {
    const res = await fetch('/api/landscape');
    if (res.ok) {
      const data = await res.json();
      gartnerVendors = data.vendors || {};
    }
  } catch (e) {
    console.error('Failed to load Gartner data', e);
  }
  gartnerLoaded = true;
}

function gartnerRating(toolName) {
  if (!gartnerVendors) return null;
  const v = gartnerVendors[toolName.toLowerCase()];
  return v && v.rating ? v.rating : null;
}

function gartnerBadge(toolName) {
  const r = gartnerRating(toolName);
  return r ? ` <span class="gartner-badge" title="Gartner Peer Insights: ${r.toFixed(1)}/5">\u2605${r.toFixed(1)}</span>` : '';
}

function renderIntel() {
  const el = document.getElementById('intel-content');
  // intelView falls back to the baseline INTEL when no pivot is active.
  const intel = intelView || INTEL;
  renderPivotChips();
  if (!intel || !intel.total_threads_analyzed) {
    const emptyMsg = (intelView && intelView !== INTEL)
      ? 'No threads match the active pivot. Remove a pivot to widen the view.'
      : 'No market intelligence data yet. Run the pipeline to analyze threads.';
    el.innerHTML = `<p class="empty">${emptyMsg}</p>`;
    return;
  }

  // Used below to mark pivoted cards with a highlight.
  const pinnedCard = (dim) => intelPivots[dim] ? ' intel-card-pinned' : '';

  const COMPANY_PREVIEW = 8;
  // named_companies has one entry per thread — dedupe by name, merge tools, count mentions.
  const companyMap = new Map();
  (intel.named_companies || []).forEach(c => {
    if (!c || !c.name) return;
    let agg = companyMap.get(c.name);
    if (!agg) {
      agg = { name: c.name, industry: null, employee_range: null, tools: new Set(), count: 0 };
      companyMap.set(c.name, agg);
    }
    agg.count += 1;
    if (!agg.industry && c.industry) agg.industry = c.industry;
    if (!agg.employee_range && c.employee_range) agg.employee_range = c.employee_range;
    (c.tools || []).forEach(t => agg.tools.add(t));
  });
  const companies = [...companyMap.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  const companyItemsHtml = companies.map((c, i) => {
    const meta = [c.industry, c.employee_range ? c.employee_range + ' emp' : null].filter(Boolean).join(', ');
    const tools = [...c.tools].join(', ');
    const cls = i >= COMPANY_PREVIEW ? ' class="co-hidden"' : '';
    const drillAttrs = ` data-drill-dim="company" data-drill-value="${esc(c.name)}" title="Click to view threads mentioning ${esc(c.name)}"`;
    const countBadge = c.count > 1 ? ` <span class="co-count">×${c.count}</span>` : '';
    return `<li${cls}${drillAttrs}>
      <span class="co-name">${esc(c.name)}</span>${countBadge}
      ${meta ? '<br><span class="co-meta">' + esc(meta) + '</span>' : ''}
      ${tools ? '<br><span class="co-meta">Tools: ' + esc(tools) + '</span>' : ''}
    </li>`;
  }).join('');
  const expandBtn = companies.length > COMPANY_PREVIEW
    ? `<button class="co-expand" onclick="toggleCompanies(this)">Show all ${companies.length}</button>`
    : '';
  const companyListHtml = companies.length > 0
    ? '<ul class="company-list">' + companyItemsHtml + '</ul>' + expandBtn
    : '<p class="empty" style="padding:1rem">No named companies detected yet</p>';

  const totalLabel = (intelView && intelView !== INTEL)
    ? 'Threads Matching Pivot'
    : 'Threads Analyzed';

  el.innerHTML = `
    <div class="intel-grid">
      <div class="intel-card">
        <div class="intel-stat">
          <div class="big-number">${intel.total_threads_analyzed}</div>
          <div class="stat-label">${totalLabel}</div>
        </div>
      </div>
      <div class="intel-card${pinnedCard('tool')}">
        <h3>Tools Mentioned</h3>
        ${renderBarChart(intel.tools, 'bar-fill-blue', 12, 'tool')}
      </div>
      <div class="intel-card${pinnedCard('pain')}">
        <h3>Pain Point Categories</h3>
        ${renderBarChart(intel.pain_point_categories, 'bar-fill-orange', 10, 'pain')}
      </div>
      <div class="intel-card${pinnedCard('function')}">
        <h3>Team Functions</h3>
        ${renderBarChart(intel.team_functions, 'bar-fill-green', 10, 'function')}
      </div>
      <div class="intel-card${pinnedCard('employee_range')}">
        <h3>Company Size Distribution</h3>
        ${renderBarChart(intel.employee_ranges, 'bar-fill-purple', 6, 'employee_range')}
      </div>
      <div class="intel-card${pinnedCard('maturity')}">
        <h3>Security Maturity</h3>
        ${renderBarChart(intel.maturity_levels, 'bar-fill-red', 4, 'maturity')}
      </div>
      <div class="intel-card${pinnedCard('industry')}">
        <h3>Industries</h3>
        ${renderBarChart(intel.industries, 'bar-fill-teal', 10, 'industry')}
      </div>
      <div class="intel-card${pinnedCard('team_size')}">
        <h3>Security Team Size</h3>
        ${renderBarChart(intel.security_team_sizes, 'bar-fill-purple', 6, 'team_size')}
      </div>
      <div class="intel-card${pinnedCard('country')}">
        <h3>Countries</h3>
        ${renderBarChart(intel.countries, 'bar-fill-teal', 10, 'country')}
      </div>
      <div class="intel-card${pinnedCard('company')}">
        <h3>Named Companies</h3>
        ${companyListHtml}
      </div>
    </div>`;
}

function toggleCompanies(btn) {
  const ul = btn.previousElementSibling;
  const expanded = ul.classList.toggle('expanded');
  const total = ul.querySelectorAll('li').length;
  btn.textContent = expanded ? 'Show less' : `Show all ${total}`;
}

function toggleDraft(header) {
  const toggle = header.querySelector('.draft-toggle');
  const body = header.nextElementSibling;
  toggle.classList.toggle('open');
  body.classList.toggle('open');
}

function copyDraft(btn) {
  const pre = btn.closest('.draft').querySelector('pre');
  navigator.clipboard.writeText(pre.textContent);
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy', 2000);
}

function resetFilters() {
  document.getElementById('f-sub').value = '';
  document.getElementById('f-score').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  document.getElementById('f-sort').value = 'date-desc';
  Object.values(DRILL_DIMENSIONS).forEach(dim => {
    const sel = document.getElementById(dim.filterId);
    if (sel) sel.value = '';
  });
  currentPage = 1;
  render();
}

// Bind filter changes. Any non-sort change resets to page 1; sort keeps the
// current page (e.g. flipping date order shouldn't dump you back to page 1).
document.querySelectorAll('.filters select, .filters input').forEach(el => {
  el.addEventListener('change', () => {
    if (el.id !== 'f-sort') currentPage = 1;
    render();
  });
});

// Pagination button wiring
document.getElementById('page-first').addEventListener('click', () => goToPage(1));
document.getElementById('page-prev').addEventListener('click', () => goToPage(currentPage - 1));
document.getElementById('page-next').addEventListener('click', () => goToPage(currentPage + 1));
document.getElementById('page-last').addEventListener('click', () => goToPage(lastPageMeta.total_pages || 1));
document.getElementById('page-jump').addEventListener('change', (e) => {
  const v = parseInt(e.target.value, 10);
  if (Number.isFinite(v)) goToPage(v);
});

// Delegated click handler for drill-down + pivot interactions on intel widgets
document.addEventListener('click', (e) => {
  // Don't hijack actual link clicks (e.g. company name → thread URL)
  if (e.target.closest('a')) return;
  // Pivot chip removal takes precedence over the drill target underneath.
  const clearBtn = e.target.closest('[data-pivot-clear]');
  if (clearBtn) {
    clearPivot(clearBtn.dataset.pivotClear);
    return;
  }
  // "View opportunities" button on the pivot chip bar.
  const drillBtn = e.target.closest('[data-pivot-drill]');
  if (drillBtn) {
    drillToOpportunitiesFromPivots();
    return;
  }
  const el = e.target.closest('[data-drill-dim]');
  if (!el) return;
  // In pivot mode (only meaningful on the intel tab), pin instead of drilling.
  const intelActive = document.getElementById('tab-intel').classList.contains('active');
  if (pivotMode && intelActive) {
    pivotOn(el.dataset.drillDim, el.dataset.drillValue);
  } else {
    drillTo(el.dataset.drillDim, el.dataset.drillValue);
  }
});

// Pivot mode toggle
document.getElementById('pivot-mode-toggle').addEventListener('change', (e) => {
  setPivotMode(e.target.checked);
});

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? 'Dark mode' : 'Light mode';
  localStorage.setItem('hakuna_theme', isDark ? 'light' : 'dark');
}

// Apply saved theme (default: light)
(function() {
  const saved = localStorage.getItem('hakuna_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('theme-btn').textContent = saved === 'dark' ? 'Light mode' : 'Dark mode';
})();

loadData();
</script>
