services:
  hakuna-signal:
    build: .
    image: hakuna-signal:local
    command: ["python", "src/main.py"]
    env_file:
      - .env
    environment:
      PORT: "8080"
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./gartner_dump:/app/gartner_dump
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    restart: unless-stopped
